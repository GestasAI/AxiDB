<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cristaleria Los Arcos</title>
<style>
  :root {
    --tinta: #1b2430;
    --suave: #5b6b7c;
    --linea: #dde3ea;
    --fondo: #f6f8fa;
    --acento: #1f6feb;
    --papel: #fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1rem;
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--tinta);
    background: var(--fondo);
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1rem; color: var(--suave); font-size: .875rem; }
  section {
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: 8px;
    padding: .75rem;
    margin-bottom: .75rem;
  }
  h2 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin: 0 0 .5rem; }
  form { display: grid; gap: .5rem; grid-template-columns: 1fr; }
  input, select, button {
    font: inherit;
    padding: .5rem .625rem;
    border: 1px solid var(--linea);
    border-radius: 6px;
    background: var(--papel);
    color: inherit;
    min-width: 0;
  }
  button { background: var(--acento); border-color: var(--acento); color: #fff; cursor: pointer; }
  button.plano { background: transparent; border-color: var(--linea); color: var(--suave); }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th, td { text-align: left; padding: .375rem .5rem; border-bottom: 1px solid var(--linea); }
  th { color: var(--suave); font-weight: 600; font-size: .75rem; text-transform: uppercase; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .fila { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .aviso { padding: .5rem .625rem; border-radius: 6px; background: #fdeaea; color: #8b1a1a; font-size: .875rem; }
  .vacio { color: var(--suave); font-size: .875rem; padding: .5rem 0; }
  .etiqueta { font-size: .75rem; padding: .125rem .375rem; border-radius: 4px; background: var(--fondo); color: var(--suave); }
  @media (min-width: 720px) {
    body { max-width: 60rem; margin: 0 auto; padding: 1.5rem; }
    form.alta { grid-template-columns: 2fr 1fr 1fr auto; align-items: end; }
    form.presu { grid-template-columns: 1.5fr 1fr .75fr .75fr .75fr auto; align-items: end; }
  }
</style>
</head>
<body>

<h1>Cristaleria Los Arcos</h1>
<p class="sub">Clientes y presupuestos. Sin backend propio: el navegador habla con AxiDB.</p>

<div id="aviso"></div>

<section>
  <h2>Nuevo cliente</h2>
  <form class="alta" id="formCliente">
    <input name="nombre" placeholder="Nombre" required>
    <input name="tel" placeholder="Telefono" inputmode="tel">
    <input name="ciudad" placeholder="Ciudad">
    <button type="submit">Dar de alta</button>
  </form>
</section>

<section>
  <h2>Nuevo presupuesto</h2>
  <form class="presu" id="formPresu">
    <select name="cliente_id" id="selCliente" required></select>
    <select name="tipo">
      <option value="mampara">Mampara</option>
      <option value="espejo">Espejo</option>
      <option value="ventana">Ventana</option>
    </select>
    <input name="ancho" type="number" placeholder="Ancho cm" required min="1">
    <input name="alto" type="number" placeholder="Alto cm" required min="1">
    <input name="precio_m2" type="number" placeholder="EUR/m2" required min="1">
    <button type="submit">Calcular y guardar</button>
  </form>
</section>

<section>
  <div class="fila" style="justify-content: space-between; margin-bottom: .5rem;">
    <h2 style="margin:0">Presupuestos</h2>
    <div class="fila">
      <select id="filtro">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendientes</option>
        <option value="aceptado">Aceptados</option>
        <option value="rechazado">Rechazados</option>
      </select>
      <button class="plano" id="semilla">Cargar ejemplo</button>
    </div>
  </div>
  <div id="tabla"></div>
  <p class="sub" id="resumen"></p>
</section>

<script type="module">
import { axidb, AxiError } from './axi.js';

const db = axidb('./api.php');

const $ = (id) => document.getElementById(id);
const eur = (c) => (c / 100).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });

function avisar(mensaje) {
  $('aviso').innerHTML = mensaje ? `<div class="aviso">${mensaje}</div>` : '';
}

/**
 * Cualquier fallo del puente llega como AxiError con su codigo HTTP dentro, asi
 * que se puede distinguir "te falta el token" de "el servidor se cayo".
 */
async function intentar(tarea) {
  try {
    avisar('');
    await tarea();
  } catch (e) {
    avisar(e instanceof AxiError ? `${e.message} (HTTP ${e.codigo})` : String(e));
  }
}

// El precio se calcula aqui y se guarda en centimos enteros. JSON tiene un solo
// tipo numerico: guardar 182.5 como decimal es pedir problemas con el dinero.
const centimos = (p) => Math.round((p.ancho / 100) * (p.alto / 100) * p.precio_m2 * 100);

async function pintarClientes() {
  const clientes = await db.find('clientes').orderBy('nombre').get();
  $('selCliente').innerHTML = clientes.length
    ? clientes.map((c) => `<option value="${c.id}">${c.nombre}</option>`).join('')
    : '<option value="">(sin clientes)</option>';
  return clientes;
}

async function pintarPresupuestos(clientes) {
  const estado = $('filtro').value;
  const consulta = db.find('presupuestos').orderBy('_createdAt', 'desc');
  if (estado) consulta.where('estado', '=', estado);
  const filas = await consulta.get();

  const porId = Object.fromEntries(clientes.map((c) => [c.id, c.nombre]));

  $('tabla').innerHTML = filas.length === 0
    ? '<p class="vacio">Todavia no hay presupuestos.</p>'
    : `<table><thead><tr>
         <th>Cliente</th><th>Tipo</th><th class="num">Medidas</th>
         <th class="num">Total</th><th>Estado</th><th></th>
       </tr></thead><tbody>${filas.map((p) => `
         <tr>
           <td>${porId[p.cliente_id] ?? '<span class="etiqueta">borrado</span>'}</td>
           <td>${p.tipo}</td>
           <td class="num">${p.ancho}x${p.alto}</td>
           <td class="num">${eur(p.centimos)}</td>
           <td><span class="etiqueta">${p.estado}</span></td>
           <td class="num">
             <button class="plano" data-acepta="${p.id}">Aceptar</button>
             <button class="plano" data-borra="${p.id}">Borrar</button>
           </td>
         </tr>`).join('')}</tbody></table>`;

  const total = filas.reduce((s, p) => s + p.centimos, 0);
  $('resumen').textContent = `${filas.length} presupuesto(s), ${eur(total)} en total.`;
}

async function refrescar() {
  const clientes = await pintarClientes();
  await pintarPresupuestos(clientes);
}

$('formCliente').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(ev.target));
  intentar(async () => {
    await db.insert('clientes', d);
    ev.target.reset();
    await refrescar();
  });
});

$('formPresu').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(ev.target));
  const p = { ...d, ancho: +d.ancho, alto: +d.alto, precio_m2: +d.precio_m2, estado: 'pendiente' };
  intentar(async () => {
    await db.insert('presupuestos', { ...p, centimos: centimos(p) });
    ev.target.reset();
    await refrescar();
  });
});

$('tabla').addEventListener('click', (ev) => {
  const acepta = ev.target.dataset.acepta;
  const borra = ev.target.dataset.borra;
  if (!acepta && !borra) return;
  intentar(async () => {
    if (acepta) await db.update('presupuestos', acepta, { estado: 'aceptado' });
    if (borra) await db.delete('presupuestos', borra);
    await refrescar();
  });
});

$('filtro').addEventListener('change', () => intentar(refrescar));

$('semilla').addEventListener('click', () => intentar(async () => {
  const ana = await db.insert('clientes', { nombre: 'Ana Ruiz', tel: '600111222', ciudad: 'Murcia' });
  const luis = await db.insert('clientes', { nombre: 'Luis Mendez', tel: '600333444', ciudad: 'Cartagena' });
  const ejemplos = [
    { cliente_id: ana.id, tipo: 'mampara', ancho: 120, alto: 195, precio_m2: 180, estado: 'pendiente' },
    { cliente_id: ana.id, tipo: 'espejo', ancho: 80, alto: 100, precio_m2: 95, estado: 'pendiente' },
    { cliente_id: luis.id, tipo: 'ventana', ancho: 150, alto: 120, precio_m2: 140, estado: 'aceptado' },
  ];
  for (const p of ejemplos) await db.insert('presupuestos', { ...p, centimos: centimos(p) });
  await refrescar();
}));

intentar(refrescar);
</script>
</body>
</html>
